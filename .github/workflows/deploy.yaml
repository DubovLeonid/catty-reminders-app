name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.space
          username: lenya
          port: 3141
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/catty-reminders-app

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            
            export IMAGE="ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}"

            export APP_CONTAINER_NAME="catty-app"
            export MARIADB_ROOT_PASSWORD="mypass"
            export MARIADB_DATABASE="catty_reminders"
            export HOST_APP_PORT="8181"
            export CONTEINER_APP_PORT="8181"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            docker compose up -d --pull always --remove-orphans --force-recreate
